[pytest]
# Without this, pytest's rootdir-insertion only adds the individual test
# file's own directory (e.g. tests/test_agents) to sys.path -- not the
# project root -- so `from app...` imports fail with
# "ModuleNotFoundError: No module named 'app'" (seen on Windows/pytest 9.x,
# where rootless import mode is stricter about this than older pytest).
# Explicitly adding the project root here makes `app` importable no matter
# which directory pytest is invoked from or which OS it runs on.
pythonpath = .
testpaths = tests
